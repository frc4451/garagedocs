name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
    branches: [main, rewrite]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Verify Practice assignment catalog
        run: npm run verify:assignment-catalog

      - name: Compile and run Java lesson examples
        run: npx vite-node scripts/test-java-lesson-examples.ts

      - name: Build site
        run: npm run build

      - name: Check internal links
        run: npm run links

      - name: Check cited sources
        run: npm run sources -- --quiet
