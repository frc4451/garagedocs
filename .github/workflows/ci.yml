name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
    branches: [main, rewrite]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build renders Mermaid diagrams to SVG in headless Chromium.
      - name: Install Chromium for Mermaid
        run: npx playwright install --with-deps chromium

      - name: Check MDX prose line length
        run: npm run lint:mdx

      - name: Test MDX prose tooling
        run: npm run test:mdx

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Verify Practice assignment catalog
        run: npm run verify:assignment-catalog

      - name: Compile and run Java lesson examples
        run: npx vite-node scripts/test-java-lesson-examples.ts

      - name: Build site
        run: npm run build

      - name: Check internal links
        run: npm run links

      # Hosts that refuse automated requests from CI (bot challenge, 403, 429, 999) are
      # reported as warnings, not failures: the link is probably valid, so check it in a
      # browser. Missing pages, 5xx, DNS errors and timeouts still fail the build. Both show
      # as annotations on the run page.
      - name: Check cited sources
        run: npm run sources -- --quiet
