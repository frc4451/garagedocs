name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Verify Practice assignment catalog
        run: npm run verify:assignment-catalog

      - name: Compile and run Java lesson examples
        run: npx vite-node scripts/test-java-lesson-examples.ts

      - name: Build
        env:
          # configure-pages reports the origin and base path for this repo's Pages setup;
          # with a custom domain or a user/organization site the base path is empty (root)
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Check internal links
        run: npm run links

      - name: Check cited sources
        run: npm run sources

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
